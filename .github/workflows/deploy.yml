# Déploiement automatique sur l'hébergement Node.js Infomaniak.
# À chaque push sur main (ou à la main depuis l'onglet Actions), les fichiers sont
# envoyés par SSH, les dépendances installées, puis le serveur redémarre tout seul
# dès qu'aucune partie n'est en cours (voir le fichier .restart dans server.js).
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   IK_SSH_HOST      hôte SSH Infomaniak (affiché dans le Manager, menu FTP / SSH)
#   IK_SSH_USER      utilisateur du compte SSH créé pour l'environnement Node.js
#   IK_SSH_PASSWORD  mot de passe de ce compte
#   IK_PATH          dossier du site, ex. /srv/customer/sites/quiz.tirtho.ch
# Le dossier data/ (les quiz enregistrés) n'est jamais envoyé ni écrasé.

name: Déployer sur Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        id: check
        env:
          IK_SSH_HOST: ${{ secrets.IK_SSH_HOST }}
          IK_SSH_USER: ${{ secrets.IK_SSH_USER }}
          IK_SSH_PASSWORD: ${{ secrets.IK_SSH_PASSWORD }}
          IK_PATH: ${{ secrets.IK_PATH }}
        run: |
          missing=""
          for v in IK_SSH_HOST IK_SSH_USER IK_SSH_PASSWORD IK_PATH; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Déploiement ignoré, secrets manquants :$missing (Settings → Secrets and variables → Actions)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier le code (syntaxe)
        run: for f in server.js lib/*.js modes/*.js modes/*/server.js; do node --check "$f"; done

      # Une seule connexion SSH authentifiée, réutilisée pour toutes les commandes
      # (Infomaniak refuse les connexions répétées en rafale : c'était la cause du code 255).
      - name: Envoyer les fichiers, installer et redémarrer
        if: steps.check.outputs.ok == 'true'
        env:
          SSHPASS: ${{ secrets.IK_SSH_PASSWORD }}
          HOST: ${{ secrets.IK_SSH_HOST }}
          USER_: ${{ secrets.IK_SSH_USER }}
          DEST: ${{ secrets.IK_PATH }}
        run: |
          set -x
          sudo apt-get install -y -qq sshpass > /dev/null
          tar czf /tmp/arcanes.tgz \
            --exclude=./.git --exclude=./.github --exclude=./node_modules \
            --exclude=./data --exclude=./test --exclude=./docs --exclude=./CLAUDE.md .
          mkdir -p ~/.ssh
          OPTS="-o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%r@%h:%p -o ControlPersist=180"
          # connexion maître (la seule qui s'authentifie)
          sshpass -e ssh $OPTS -fN "$USER_@$HOST" || { echo "Connexion SSH refusée (code $?)"; exit 1; }
          ssh $OPTS "$USER_@$HOST" "mkdir -p '$DEST'"
          scp $OPTS /tmp/arcanes.tgz "$USER_@$HOST:$DEST/.deploy.tgz"
          ssh $OPTS "$USER_@$HOST" "cd '$DEST' && tar xzf .deploy.tgz && rm -f .deploy.tgz && echo 'Fichiers envoyés.'"
          ssh $OPTS "$USER_@$HOST" "sh '$DEST/scripts/remote-deploy.sh'"
          ssh $OPTS -O exit "$USER_@$HOST" 2>/dev/null || true
