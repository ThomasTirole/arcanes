# Déploiement automatique sur l'hébergement Node.js Infomaniak.
# À chaque push sur main (ou à la main depuis l'onglet Actions), les fichiers sont
# envoyés par SSH, les dépendances installées, puis le serveur redémarre tout seul
# dès qu'aucune partie n'est en cours (voir le fichier .restart dans server.js).
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   IK_SSH_HOST      hôte SSH Infomaniak (affiché dans le Manager, menu FTP / SSH)
#   IK_SSH_USER      utilisateur du compte SSH créé pour l'environnement Node.js
#   IK_SSH_PASSWORD  mot de passe de ce compte
#   IK_PATH          dossier du site, ex. /srv/customer/sites/quiz.tirtho.ch
# Le dossier data/ (les quiz enregistrés) n'est jamais envoyé ni écrasé.

name: Déployer sur Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        id: check
        env:
          IK_SSH_HOST: ${{ secrets.IK_SSH_HOST }}
          IK_SSH_USER: ${{ secrets.IK_SSH_USER }}
          IK_SSH_PASSWORD: ${{ secrets.IK_SSH_PASSWORD }}
          IK_PATH: ${{ secrets.IK_PATH }}
        run: |
          missing=""
          for v in IK_SSH_HOST IK_SSH_USER IK_SSH_PASSWORD IK_PATH; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Déploiement ignoré, secrets manquants :$missing (Settings → Secrets and variables → Actions)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier le code (syntaxe)
        run: for f in server.js lib/*.js modes/*.js modes/*/server.js; do node --check "$f"; done

      # Infomaniak relance l'application (et coupe les sessions SSH) dès que ses fichiers changent.
      # Donc : on attend qu'aucune partie ne soit en cours, on dépose l'archive HORS du dossier du site,
      # on la déballe d'un coup (la coupure SSH qui suit est normale), puis on se reconnecte pour
      # réinstaller les dépendances si besoin et vérifier que la nouvelle version tourne.
      - name: Attendre qu'aucune partie ne soit en cours
        if: steps.check.outputs.ok == 'true'
        env:
          SITE: ${{ vars.SITE_URL || 'https://quiz.tirtho.ch' }}
        run: |
          for i in $(seq 1 40); do
            busy=$(curl -fsS --max-time 10 "$SITE/api/status" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("busy",0))' 2>/dev/null || echo "?")
            if [ "$busy" = "0" ] || [ "$busy" = "?" ]; then echo "Aucune partie en cours ($busy)."; exit 0; fi
            echo "$busy partie(s) en cours, nouvel essai dans 30 s…"; sleep 30
          done
          echo "::warning::Des parties sont toujours en cours après 20 min : déploiement quand même."

      - name: Déposer et installer la nouvelle version
        if: steps.check.outputs.ok == 'true'
        env:
          SSHPASS: ${{ secrets.IK_SSH_PASSWORD }}
          HOST: ${{ secrets.IK_SSH_HOST }}
          USER_: ${{ secrets.IK_SSH_USER }}
          DEST: ${{ secrets.IK_PATH }}
        run: |
          sudo apt-get install -y -qq sshpass > /dev/null
          tar czf /tmp/arcanes.tgz \
            --exclude=./.git --exclude=./.github --exclude=./node_modules \
            --exclude=./data --exclude=./test --exclude=./docs --exclude=./CLAUDE.md .
          OPTS="-o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20"
          # 1) l'archive va dans le dossier personnel (hors du site : pas de redémarrage)
          sshpass -e scp $OPTS /tmp/arcanes.tgz "$USER_@$HOST:.arcanes-deploy.tgz"
          # 2) déballage dans le site : Infomaniak redémarre l'application, la connexion peut être coupée
          set +e
          sshpass -e ssh $OPTS "$USER_@$HOST" "cd '$DEST' && tar xzf ~/.arcanes-deploy.tgz && rm -f ~/.arcanes-deploy.tgz && echo 'Fichiers en place.'"
          code=$?
          set -e
          if [ $code -ne 0 ] && [ $code -ne 255 ]; then echo "::error::Échec du déballage (code $code)"; exit 1; fi
          [ $code -eq 255 ] && echo "Connexion coupée par le redémarrage d'Infomaniak (normal)."
          # 3) reconnexion après le redémarrage, dépendances si package.json a changé
          for i in 1 2 3 4 5 6; do
            sleep 15
            if sshpass -e ssh $OPTS "$USER_@$HOST" "rm -f ~/.arcanes-deploy.tgz; sh '$DEST/scripts/remote-deploy.sh'"; then
              exit 0
            fi
            echo "Serveur pas encore disponible, nouvel essai…"
          done
          echo "::warning::Impossible de se reconnecter pour vérifier les dépendances. Si le site ne répond pas : « Build » puis « Run » dans le Manager."

      - name: Vérifier que le site répond
        if: steps.check.outputs.ok == 'true'
        env:
          SITE: ${{ vars.SITE_URL || 'https://quiz.tirtho.ch' }}
        run: |
          want=$(node -p "require('./package.json').version")
          for i in $(seq 1 12); do
            if out=$(curl -fsS --max-time 10 "$SITE/api/status"); then
              echo "Réponse : $out"
              echo "$out" | grep -q "\"version\":\"$want\"" && { echo "✅ Version $want en ligne."; exit 0; }
            fi
            sleep 10
          done
          echo "::warning::Le site ne renvoie pas encore la version $want. Vérifie les logs dans le Manager (et lance « Run » si l'application est arrêtée)."
